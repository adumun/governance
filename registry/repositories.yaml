registryVersion: 1.0.1
schemaVersion: 1.0.0
status: CURRENT_CANDIDATE
repositories:
  - repository: adumun/governance
    class: GOVERNANCE
    status: ACTIVE
    role: Enterprise repository standards, policy, tooling governance and repository/relationship governance registry.
    authority: CURRENT_CANDIDATE
    standards: [RS-CORE, RS-GOV, RS-CONTRACT]
  - repository: adumun/machine-contracts
    class: CONTRACT
    status: ACTIVE
    role: Canonical version-control home for enterprise machine contracts, schemas, mappings, profiles, fixtures and validators.
    authority: CURRENT_CANDIDATE
    standards: [RS-CORE, RS-CONTRACT, RS-TOOLING]
  - repository: adumun/audit-framework
    class: GOVERNANCE
    status: ACTIVE
    role: Canonical version-control home for audit semantics, domain profiles, mechanisms, schemas and evidence registry.
    authority: CURRENT
    standards: [RS-CORE, RS-GOV, RS-CONTRACT]
  - repository: adumun/prospect-prototypes
    class: CAPABILITY
    status: EXPERIMENTAL
    role: Reusable commercial-discovery capability for client-safe navigable prospect prototypes and validation surfaces.
    authority: CURRENT_CANDIDATE
    standards: [RS-CORE, RS-CONTRACT, RS-CAPABILITY, RS-FRONTEND, RS-PAGES, RS-EXPERIMENT]
  - repository: adumun/contract-registry
    class: LEGACY
    status: DEPRECATED
    role: Historical predecessor formerly located at cmartinezs/the-x-contract-registry; transferred without reviving authority.
    newConsumersAllowed: false
    activeDevelopment: false
    successors:
      - adumun/governance
      - adumun/machine-contracts
      - adumun/audit-framework
    standards: [RS-CORE, RS-LEGACY]
notes:
  - Repository provider transfers do not erase predecessor lineage; historical evidence may continue to cite the repository name valid when that evidence was created.
  - adumun/contract-registry is deprecated despite its new provider location and must not receive new consumers or authority.
  - adumun/prospect-prototypes was transferred from cmartinezs/the-x-prospect-prototypes; new canonical references use the ADÜMÜN organization path.
  - Historical portfolio seed observations remain referenced under registry/historical and are not silently promoted as current facts.
