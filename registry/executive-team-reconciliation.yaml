  CLO:
    status: DETAILED_ROLE_CANDIDATE
    ref: ADM-ORG-CLO-001
    machineReadablePath: registry/executive-roles/clo.yaml

nextArtifacts:
  - Executive Decision Rights Matrix
  - Materiality & Delegation Framework
  - Executive Decision Register schema
  - Executive Policy Exception Register schema
  - final CFO role reconciliation

maturityExitCriteria:
  - tested_against_real_m0_m6_decisions
  - material_role_contract_conflicts_reconciled
  - final_cfo_mandate_reconciled
  - corporate_shareholder_or_board_authority_reconciled
  - decision_rights_matrix_operationally_usable
  - multi_hat_independent_challenge_mechanism_usable
  - customer_and_employee_voice_present_in_executive_review
