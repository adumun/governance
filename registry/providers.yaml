rules:
  - Unknown cost is null/TBD, never zero.
  - CURRENT means the tool is part of the current operating tool landscape; it does not assert a particular paid tier unless entitlement_status says so.
  - PLANNED/CANDIDATE/DEFERRED tools do not contribute to current OPEX until actually activated or contracted.
  - Every provider must map to one or more enterprise capabilities; capabilities must not be defined as synonymous with a provider.
  - Provider replacement/exit paths should be documented for medium/high dependency capabilities.
  - The provider registry must be reconcilable with the live financial baseline and the Funding Activation Dashboard.