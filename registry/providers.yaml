    capabilities: [CAP-AI-ASSISTANCE, CAP-CODING-ASSISTANCE, CAP-KNOWLEDGE-WORK]
    strategic_role: [ANALYSIS, CODING, DOCUMENTATION, ORCHESTRATION, CONTENT]
    dependency_level: MEDIUM
    substitution_strategy: MULTI_MODEL_AND_OPEN_LOCAL_OPTIONALITY
    cost_status: TO_RECONCILE_WITH_FINANCIAL_BASELINE
    monthly_cost_clp: null
    financial_treatment: FOUNDER_OR_CORPORATE_DEPENDING_ON_TRANSITION
    notes:
      - Do not make an operational process dependent on a single model/provider when a provider-neutral contract is practical.

