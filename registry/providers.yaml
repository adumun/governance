schema_version: 0.1.0
maturity: CANDIDATE
last_reviewed: 2026-08-25
purpose: >-
  Version the enterprise tool/provider landscape independently from any single
  capability. A provider can be current, planned, candidate or retired, and can
  support multiple corporate capabilities.

lifecycle_status_vocabulary:
  - CURRENT
  - PLANNED
  - CANDIDATE
  - DEFERRED
  - RETIRED

usage_status_vocabulary:
  - IN_USE
  - LIMITED_USE
  - TO_CONFIRM
  - FUTURE
  - NOT_IN_USE

