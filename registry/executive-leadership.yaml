principles:
  - id: ELT-P01
    statement: Distinct executive accountability domains may be temporarily held by the same person.
  - id: ELT-P02
    statement: Product and Technology remain conceptually separate; CPO owns what and why, CTO owns technological capability and engineering approach.
  - id: ELT-P03
    statement: Revenue and Finance remain conceptually separate to preserve tension between growth, margin, cash, risk and sustainability.
  - id: ELT-P04
    statement: Executive titles are created because accountability requires them, not to simulate organizational maturity.
  - id: ELT-P05
    statement: New C-Level roles require an explicit trigger, mandate, decision rights, interfaces and evidence that separation reduces ambiguity, coordination cost or material risk.

currentBaseline:
  - code: CEO
    title: Chief Executive Officer
    responsibility: Enterprise direction, corporate strategy, executive priorities, resource allocation, company-wide decision accountability and executive-team coordination.
    status: DETAILED_ROLE_CANDIDATE
    detailedRoleRef: ADM-ORG-CEO-001
  - code: CFO
    title: Chief Financial Officer
    responsibility: Finance, treasury, accounting, taxation, budgeting, financial control, funding, capital allocation and economic sustainability.
    status: ROLE_DEFINITION_IN_PROGRESS
  - code: COO
    title: Chief Operating Officer
    responsibility: Enterprise operating model, transversal execution, operational performance, cross-unit coordination, process effectiveness and continuous improvement.
    status: DETAILED_ROLE_CANDIDATE
    detailedRoleRef: ADM-ORG-COO-001
  - code: CTO
    title: Chief Technology Officer
    responsibility: Technology strategy, architecture, engineering, platforms, infrastructure, AI and agents, technical standards, DevOps and technical security.
    status: DESIGN_BASELINE
  - code: CPO
    title: Chief Product Officer
    responsibility: Product strategy, discovery, validation, product portfolio, lifecycle, product experience and prioritization of what ADÜMÜN builds for users and markets.
    status: DETAILED_ROLE_CANDIDATE
    detailedRoleRef: ADM-ORG-CPO-001
  - code: CRO
    title: Chief Revenue Officer
    responsibility: Revenue strategy, commercial model, sales, pricing, channels, partnerships, monetization, pipeline and customer/account growth.
    status: DETAILED_ROLE_CANDIDATE
    detailedRoleRef: ADM-ORG-CRO-001
  - code: CLO
    title: Chief Legal Officer
    responsibility: Corporate legal affairs, contracts, intellectual property, labor/legal coordination, privacy, regulation, compliance and legal risk protection.
    status: DESIGN_BASELINE

detailedRoles:
  CEO:
    id: ADM-ORG-CEO-001
    title: Chief Executive Officer
    maturity: CANDIDATE
    authorityState: CURRENT
    humanSourceSection: 17. CEO — Chief Executive Officer — Detailed Executive Mandate
    executiveLevel: C_LEVEL
    accountabilityScope: ENTERPRISE_WIDE
    purpose: Convert ADÜMÜN vision into coherent enterprise direction, strategic priorities, resource allocation and sustainable corporate results.
    optimizationTarget: ADÜMÜN as an enterprise, not any individual initiative, product, vertical, creative property or technology.
    coreAccountabilities:
      - corporate strategy
      - enterprise priorities
      - portfolio coherence
      - executive resource allocation
      - C-Level coordination
      - cross-domain conflict resolution
      - material strategic decisions
      - enterprise performance
      - institutional representation
      - continuity and sustainability
      - delegation quality and executive accountability clarity
    sixMonthMandate:
      - preserve enterprise survival
      - concentrate execution on defensible priorities
      - enable real revenue validation with CFO, CRO and CPO
      - convert governance design into operating behavior with COO
      - reduce dependency on founder/CEO intervention through delegation
      - preserve strategic optionality while solving short-term constraints
    reservedDecisions:
      - create_modify_or_eliminate_c_level_roles
      - material_corporate_strategy_changes
      - enterprise_level_objectives
      - enter_or_exit_major_business_lines
      - create_or_retire_business_vertical_l1
      - strategic_initiative_activation_pause_or_termination_when_material
      - material_policy_exceptions
      - unresolved_c_level_conflicts
      - extraordinary_resource_reallocation
      - major_strategic_alliances
      - substantive_business_model_changes
      - decisions_materially_affecting_independence_reputation_or_long_term_position
    constraints:
      - ultimate_executive_authority_is_not_arbitrary_authority
      - professional_findings_must_not_be_falsified_suppressed_or_redefined_to_support_preference
      - legal_impossibility_or_illegality_is_not_overrideable
      - subject_matter_executives_retain_professional_accountability_within_approved_mandates
      - material_overrides_require_visible_rationale_risk_and_consequences
    boundaries:
      CFO: CEO sets direction and risk appetite; CFO determines financial reality, constraints and sustainability.
      COO: CEO owns required enterprise outcomes; COO owns the operating system that executes them.
      CRO: CEO sets business direction; CRO owns the revenue system and sustainable commercial execution.
      CPO: CEO sets strategic problems and portfolio direction; CPO owns product strategy, discovery, validation and product portfolio decisions.
      CTO: CEO sets strategic needs and constraints; CTO owns technology strategy, architecture, engineering approach and technical standards.
      CLO: CEO may accept lawful business risk; CLO identifies legal constraints and exposure; illegality is not overrideable.
    antiPatterns:
      - default_owner_of_tickets
      - routine_project_management
      - approve_every_expenditure
      - prescribe_detailed_technology_choices
      - act_as_default_product_manager
      - execute_ordinary_sales
      - day_to_day_management_of_all_teams
      - become_required_for_normal_company_operation
    delegationPrinciple: Delegation transfers decision authority but not ultimate enterprise accountability; normal work should increasingly execute correctly without CEO intervention.
    enterpriseOptimizationPrinciple: Historical attachment to an initiative, technology or creative property is insufficient justification for continued investment when evidence no longer supports its opportunity cost.
    m0M6Indicators:
      - runway_protected_or_extended
      - real_revenue_generated
      - enterprise_priority_execution_rate
      - resource_concentration_on_approved_priorities
      - unresolved_decisions_without_owner
      - dependency_on_ceo_intervention
      - idea_to_evidence_to_offer_to_revenue_progress
      - strategic_risk_treatment
      - portfolio_rationalization
      - approved_m0_m6_objective_achievement
    institutionalRepresentation: Primary executive representative for material strategic relationships, subject to legal, financial and governance authority limits.
    reportingLine: Highest executive authority under the founding operating model; later accountable to the legally competent shareholder, Board or equivalent governing authority.
    officeOfCeoRule: Do not create a separate Office of the CEO unless evidence shows dedicated support reduces material coordination cost.

  COO:
    id: ADM-ORG-COO-001
    title: Chief Operating Officer
    maturity: CANDIDATE
    authorityState: CURRENT
    humanSourceSection: 18. COO — Chief Operating Officer — Detailed Executive Mandate
    executiveLevel: C_LEVEL
    accountabilityScope: ENTERPRISE_OPERATIONS
    purpose: Convert ADÜMÜN strategy into a coherent, observable and repeatable enterprise operating system.
    operatingSystemPrinciple: The COO does not own every operation; the COO owns the system through which operations remain coherent.
    coreAccountabilities:
      - enterprise operating model
      - transversal execution
      - operating cadence
      - process design
      - dependency management
      - operational performance
      - capacity visibility
      - work in progress discipline
      - escalation mechanisms
      - blocker resolution
      - business continuity coordination
      - cross-unit operating coherence
      - operational reporting
      - incident-system integrity
      - continuous improvement
    sixMonthMandate:
      - convert governance documentation into operating behavior
      - establish a minimal enterprise operating cadence
      - make priorities owners dependencies blockers and evidence visible
      - reduce uncontrolled work in progress
      - create explicit escalation paths
      - improve milestone predictability
      - automate repetitive operational toil without obscuring accountability
      - materially reduce founder_or_ceo_dependency_for_routine_coordination
    governanceExecutionChain:
      - decision
      - owner
      - work
      - execution
      - evidence
      - outcome
      - review
      - next_decision
    authority:
      - define_transversal_operating_processes
      - require_explicit_ownership_for_material_cross_domain_work
      - establish_operational_reporting_standards
      - require_status_and_evidence_for_enterprise_commitments
      - define_escalation_paths
      - coordinate_cross_unit_dependencies
      - eliminate_redundant_operating_processes
      - introduce_operational_controls
      - require_postmortems_or_corrective_actions_after_material_failures
      - propose_redistribution_of_operating_capacity
      - suspend_clearly_defective_process_pending_correction_when_material_risk_exists
    constraints:
      - may_not_change_corporate_strategy_unilaterally
      - may_not_redefine_ceo_approved_priorities_unilaterally
      - may_not_reallocate_material_capital_against_cfo_controls
      - may_not_redefine_product_strategy_against_cpo_accountability
      - may_not_prescribe_technical_architecture_against_cto_authority
      - may_not_create_commercial_commitments_against_cro_authority
      - may_not_reinterpret_legal_obligations_against_clo_authority
      - may_not_absorb_business_vertical_ownership_due_to_coordination_difficulty
    boundaries:
      CEO: CEO owns required outcomes and strategic priority; COO owns the operating system that executes them.
      CFO: COO determines operational capacity needs and execution constraints; CFO determines affordability and economic sustainability.
      CRO: CRO owns commercial demand and commitments; COO ensures delivery capacity and operating controls can support them.
      CPO: CPO owns product strategy and roadmap decisions; COO owns cross-enterprise operating mechanisms enabling product work.
      CTO: CTO owns technology strategy and technical operating methods; COO owns integration of Technology into enterprise operating coherence.
      CLO: CLO determines legal obligations and interpretation; COO ensures applicable legal requirements become operational controls and evidence.
      GovernanceAudit: COO operates and improves the system; Governance & Audit independently evaluates and challenges it.
    verticalRelationship: Business Verticals own operating and commercial outcomes; COO owns enterprise operating interfaces and coherence across verticals and corporate functions.
    notPmoRule: COO accountability is broader than project tracking or milestone administration; any future PMO is only one possible supporting capability.
    notChiefOfStaffRule: Chief of Staff amplifies the CEO; COO amplifies the organization through enterprise operating coherence.
    potentialCapabilities:
      - Enterprise Operations
      - Operational Excellence
      - Execution & Coordination
      - Business Continuity
      - Delivery Operations when justified
      - PMO when justified
    automationPrinciple: Automation removes toil but never removes accountable ownership, escalation paths or decision authority.
    capacityModel:
      dimensions:
        - demand
        - available_capacity
        - committed_capacity
        - actual_throughput
      rule: When demand exceeds sustainable capacity, surface the constraint and force sequencing, reduction or explicit risk acceptance.
    workInProgressRule: Enterprise work in progress must remain below actual sustainable execution capacity.
    operatingStates:
      - ACTIVE
      - PAUSED
      - BACKLOG
      - TERMINATED_OR_RETIRED
    blockerLevels:
      L0: local blocker resolvable within the team
      L1: cross-team blocker requiring coordination
      L2: executive-domain blocker requiring C-Level authority
      L3: enterprise blocker requiring CEO or executive arbitration
    incidentFlow:
      - detect
      - contain
      - owner
      - resolve
      - learn
      - prevent_recurrence
    m0M6Indicators:
      - enterprise_priority_completion_rate
      - milestone_predictability
      - work_blocked_beyond_threshold
      - cycle_time
      - lead_time
      - committed_vs_available_capacity
      - work_in_progress
      - overload_and_context_switching
      - unresolved_dependencies
      - cross_domain_blocker_age
      - decision_latency
      - recurring_incidents
      - failed_handoffs
      - rework_rate
      - process_exceptions
      - manual_repetitive_work_removed
      - automation_failure_rate
      - founder_or_ceo_operational_dependency
    targetOutcomeM0M6: ADÜMÜN can execute principal priorities through an explicit, observable and proportionate operating system without constant manual CEO coordination.
    operatingPrinciples:
      - strategy_without_execution_is_not_an_operating_result
      - governance_must_become_behavior_not_documentation
      - every_material_piece_of_work_requires_an_accountable_owner
      - every_material_dependency_requires_an_explicit_interface
      - work_in_progress_must_remain_below_sustainable_capacity
      - automation_does_not_own_accountability
      - operating_system_should_reduce_ceo_dependency
      - processes_exist_to_improve_outcomes_not_to_justify_themselves
      - repeated_manual_coordination_indicates_operating_system_debt
      - repeated_exceptions_require_process_or_policy_review
    antiPatterns:
      - micromanager
      - central_project_manager_for_all_work
      - universal_approval_gate
      - process_bureaucracy_generator
      - executor_of_every_transversal_task
      - shadow_ceo
      - shadow_cfo
      - owner_of_every_incident
      - default_manager_of_every_person
    reportingLine: CEO

  CRO:
    id: ADM-ORG-CRO-001
    title: Chief Revenue Officer
    maturity: CANDIDATE
    authorityState: CURRENT
    humanSourceSection: 19. CRO — Chief Revenue Officer — Detailed Executive Mandate
    executiveLevel: C_LEVEL
    accountabilityScope: ENTERPRISE_REVENUE
    purpose: Build and operate ADÜMÜN's revenue system, converting validated market value into sustainable commercial results.
    coreAccountabilities:
      - revenue strategy
      - go-to-market
      - commercial architecture
      - sales and business development
      - pricing and packaging
      - qualified pipeline
      - lead generation
      - partnerships and channels
      - customer acquisition
      - account growth
      - monetization
      - commercial experimentation
      - offer management
      - revenue forecasting
      - revenue attribution
      - market feedback and customer learning
    sixMonthMandate:
      - identify responsible early revenue from capabilities available now
      - define explicit revenue architecture
      - transform capabilities into sellable offers
      - establish a reliable commercial pipeline
      - run disciplined revenue experiments
      - validate willingness to pay
      - protect revenue quality with CFO and COO
      - connect public presence to qualified opportunity generation where appropriate
      - prove at least one repeatable customer_problem_to_collected_revenue_path
    revenueArchitecture:
      - SERVICES
      - PRODUCTS
      - RECURRING_REVENUE
      - LICENSING_AND_IP
      - PARTNERSHIPS
      - COMMERCE
      - OTHER_VALIDATED_MODELS
    revenueLifecycle:
      - market
      - awareness
      - lead
      - qualification
      - offer
      - proposal
      - negotiation
      - close
      - delivery_interface
      - billing_interface
      - payment
      - retention
      - expansion
    offerMinimum:
      - target_customer
      - problem
      - value_promise
      - scope
      - exclusions
      - price_or_pricing_model
      - delivery_model
      - evidence
      - service_or_support_assumptions
      - commitments
      - expected_economic_contribution
    authority:
      - define_revenue_strategy
      - define_gtm_motions
      - define_commercial_packaging
      - propose_standard_pricing
      - define_sales_process
      - define_pipeline_stages
      - define_qualification_rules
      - define_customer_segmentation
      - run_commercial_experiments
      - define_channel_strategy
      - define_partnership_models
      - define_account_development_approaches
      - define_market_activation_mechanisms
    constraints:
      - may_not_redefine_corporate_strategy_for_a_sale
      - may_not_represent_pipeline_as_booked_billed_or_collected_revenue
      - may_not_convert_every_client_request_into_product_roadmap_commitment
      - may_not_commit_unavailable_operational_capacity
      - may_not_sell_nonexistent_technical_capability_as_production_ready
      - may_not_override_cfo_economic_controls
      - may_not_reinterpret_legal_obligations
      - may_not_commit_unapproved_ip_or_licensing_rights
      - may_not_bind_adumun_beyond_delegated_commercial_authority
    boundaries:
      CEO: CEO establishes enterprise direction and strategic positioning; CRO owns the revenue engine within that direction.
      CFO: CRO optimizes market conversion and revenue growth; CFO determines cost floors, margin, liquidity, cash timing and financial sustainability.
      COO: CRO owns commercial commitments; COO ensures material commitments are reasonably deliverable through the enterprise operating system.
      CPO: CRO owns market and commercial evidence; CPO owns productization and roadmap decisions.
      CTO: CRO surfaces market demand; CTO determines technical feasibility, constraints, operating cost, technical risk and supportability.
      CLO: CRO owns commercial negotiation within approved patterns; CLO owns legal interpretation and material legal-risk assessment.
    pricingAuthority:
      croOwns:
        - market_facing_price_design
        - packaging
        - discount_strategy_within_policy
        - commercial_negotiation
      cfoOwns:
        - cost_floor_visibility
        - required_economics
        - margin_implications
        - cash_implications
      belowEconomicFloor: CFO_REVIEW_REQUIRED
      materialStrategicException: CEO_CFO_CRO_ALIGNMENT
    pipelineStages:
      - LEAD
      - QUALIFIED
      - DISCOVERY
      - OFFER
      - PROPOSAL
      - NEGOTIATION
      - WON
      - LOST
    opportunityMinimum:
      - account_or_customer
      - offer
      - estimated_value
      - probability_or_confidence
      - owner
      - next_action
      - expected_close
      - source
      - material_blockers
      - dependencies
    revenueStates:
      - PIPELINE
      - WEIGHTED_PIPELINE
      - COMMITTED
      - BOOKED
      - BILLED
      - COLLECTED
    idealCustomerProfileDimensions:
      - industry_or_domain
      - size_or_purchasing_capacity
      - problem_severity
      - urgency
      - ability_and_willingness_to_pay
      - buying_process
      - delivery_fit
      - strategic_fit
    partnershipModels:
      - referral
      - channel
      - reseller
      - co_selling
      - strategic_alliance
      - technology_partnership
      - sponsorship
      - licensing
      - distribution
    interimMarketingScope:
      - market_activation
      - acquisition
      - operational_positioning
      - campaigns
      - audience_development
      - conversion
    publicPresenceRevenueFlow:
      - credibility
      - audience
      - discovery
      - opportunity
      - conversion
      - revenue
    revenueExperimentFields:
      - customer
      - problem
      - offer
      - channel
      - price
      - expected_evidence
      - experiment_window
      - result
      - decision
    revenueExperimentDecisions:
      - SCALE
      - ITERATE
      - HOLD
      - KILL
    commercialAdmissionCriteria:
      - revenue
      - margin_or_contribution
      - cash_timing
      - strategic_fit
      - reusable_capability_potential
      - reference_value
      - learning_value
      - ip_implications
      - delivery_capacity
      - legal_and_security_risk
      - opportunity_cost
    dealQualityDimensions:
      - REVENUE
      - MARGIN
      - CASH
      - STRATEGIC_FIT
      - REUSE
      - REFERENCE_VALUE
      - RISK
      - CAPACITY
    customerFeedbackEvidence:
      - objections
      - requested_features
      - reasons_lost
      - willingness_to_pay
      - price_sensitivity
      - competitor_references
      - buying_criteria
    customerOwnership:
      commercialRelationship: CRO
      deliveryExecution: COO_OR_DELIVERY
      productExperienceAndDecisions: CPO
      financialControl: CFO
      legalInterpretation: CLO
    commercialCommitmentMinimum:
      - price
      - scope
      - delivery_or_availability_assumptions
      - payment_terms
      - sla_or_support_when_applicable
      - ip_or_licensing_treatment
      - exclusions
      - termination_or_cancellation_conditions
    revenueQualityClasses:
      HIGH_QUALITY: acceptable economics, favorable cash timing, repeatability, strategic alignment and manageable support burden
      STRATEGIC: conscious near-term economic tradeoff for reference, learning, market entry or reusable capability
      BAD: poor economics, excessive customization, delayed collection, high support burden, material risk or strategic distraction
    criticalMetric: VALIDATED_REVENUE_ENGINE
    validatedRevenueEngineDefinition: At least one reasonably repeatable path from a defined customer or ICP and known problem through a known channel and defined offer at a tested price to successful delivery and collected revenue.
    m0M6Indicators:
      - booked_revenue
      - collected_revenue
      - recurring_revenue
      - gross_contribution
      - qualified_pipeline
      - weighted_pipeline
      - pipeline_coverage
      - conversion
      - win_rate
      - sales_cycle_duration
      - average_deal_value
      - lead_to_qualified_conversion
      - qualified_to_opportunity_conversion
      - opportunity_to_customer_conversion
      - validated_offers
      - offer_conversion
      - revenue_by_offer
      - renewal_churn_and_expansion_when_applicable
      - acquisition_cost
      - revenue_per_commercial_effort
      - discount_rate
      - forecast_accuracy
      - failed_commercial_commitments
    potentialCapabilities:
      - Revenue Strategy
      - Sales / Business Development
      - Partnerships
      - Commercial Operations
      - Offer Management
      - Marketing & Market Activation (interim)
    operatingPrinciples:
      - revenue_is_evidence_of_value_exchange_not_proof_every_deal_is_good
      - revenue_is_not_cash_and_pipeline_is_not_revenue
      - capability_is_not_automatically_a_commercial_offer
      - client_request_is_evidence_not_automatic_product_roadmap_authority
      - no_material_commercial_commitment_without_reasonable_deliverability
      - pricing_must_reflect_market_and_economic_reality
      - commercial_learning_flows_to_product_and_strategy
      - commercial_exceptions_remain_visible
      - prefer_repeatable_high_quality_revenue_over_destructive_topline
      - commercial_experiments_end_in_explicit_decisions
    antiPatterns:
      - sales_at_any_cost
      - discount_machine
      - impossible_promises
      - product_roadmap_owner
      - shadow_cfo
      - delivery_owner
      - vanity_metric_marketer
      - pipeline_inflater
      - opportunity_hoarder
      - hiding_collection_risk
      - unlimited_bespoke_work
    targetOutcomeM0M6: Demonstrate at least one repeatable commercial path from a defined customer problem and offer to collected revenue without economically, operationally, legally or strategically destructive commitments.
    reportingLine: CEO

  CPO:
    id: ADM-ORG-CPO-001
    title: Chief Product Officer
    maturity: CANDIDATE
    authorityState: CURRENT
    humanSourceSection: 20. CPO — Chief Product Officer — Detailed Executive Mandate
    executiveLevel: C_LEVEL
    accountabilityScope: ENTERPRISE_PRODUCT
    primaryAccountability: Own ADÜMÜN's product strategy and product portfolio, deciding what should become a product, for whom, why, with what evidence, and whether continued investment remains justified.
    purpose: Convert problems, needs, opportunities and evidence into coherent, usable and sustainable products while preventing ideas, repositories, tools, client requests and experiments from becoming products accidentally.
    coreAccountabilities:
      - product strategy
      - product discovery
      - problem and customer validation
      - value proposition
      - product portfolio
      - product lifecycle
      - productization decisions
      - product prioritization
      - roadmap governance
      - product experience
      - user and customer research
      - product analytics
      - experimentation
      - adoption and retention outcomes
      - product investment theses
      - product-market evidence
      - continue pivot pause productize scale retire and kill decisions
    sixMonthMandate:
      - replace idea_driven_and_repository_driven_product_behavior_with_evidence_driven_decisions
      - establish_explicit_product_portfolio
      - control_product_work_in_progress
      - identify_and_resolve_zombie_products
      - define_minimum_evidence_expectations_proportional_to_investment
      - connect_product_with_revenue_and_technology_without_collapsing_accountabilities
      - demonstrate_at_least_one_validated_product_path
    identityRules:
      softwareNotProduct: Software, repositories, deployed applications, prototypes, internal automation and technical systems are not automatically products.
      initiativeNotProduct: Initiative lifecycle and product maturity are separate dimensions; an initiative may conclude with no product.
      capabilityNotProduct: Reusable capability does not become a product without a defined consumer, value proposition, support model, strategic fit and supporting evidence.
      clientSolutionNotProduct: Customer-specific solutions remain CLIENT_SOLUTION unless evidence justifies productization.
    productizationTaxonomy:
      INTERNAL: Solution primarily serving ADÜMÜN internal operations.
      SHARED_CAPABILITY: Reusable capability consumed by multiple internal or external contexts without necessarily being a standalone product.
      PRODUCT: Repeatable offering intended for defined users or customers.
      CLIENT_SOLUTION: Customer-specific solution whose scope, economics or obligations remain client-specific.
      MANAGED_SERVICE: Continuously operated service delivered by ADÜMÜN.
      HYBRID: Intentional combination of classifications with explicit ownership, economics and operating model.
    productLifecycle:
      - PROBLEM_OR_OPPORTUNITY
      - DISCOVERY
      - VALIDATION
      - PRODUCT_CANDIDATE
      - EXPERIMENT_OR_BUILD
      - PILOT
      - PRODUCTIZED
      - OPERATE_OR_SCALE
      - RETIRED
    admissionCriteria:
      - problem
      - user
      - evidence
      - value
      - differentiation
      - strategic_fit
      - feasibility
      - operability
      - economics
      - risk
    productizationTrigger:
      - repeated_need
      - multiple_potential_consumers
      - reusable_core
      - separable_intellectual_property
      - supportability
      - market_evidence
      - economic_potential
    prioritizationDimensions:
      - strategic_fit
      - problem_severity
      - evidence_confidence
      - reach
      - user_value
      - revenue_potential
      - effort
      - time_to_evidence
      - risk
      - reuse
      - differentiation
      - opportunity_cost
    productWipPrinciple: Maintain many ideas, fewer active discoveries and very few simultaneous active product bets; Product WIP must respect Product, Technology, Operations and financial capacity.
    explicitDecisionStates:
      - CONTINUE
      - PIVOT
      - PAUSE
      - PRODUCTIZE
      - SCALE
      - RETIRE
      - KILL
    killCriteria:
      - weak_problem_evidence
      - insufficient_usage
      - absent_willingness_to_pay_when_commercially_relevant
      - excessive_cost
      - unsustainable_support_burden
      - superior_external_alternative
      - insufficient_differentiation
      - material_legal_or_ip_risk
      - excessive_opportunity_cost
      - strategic_change
      - repeated_negative_evidence
    zombieProductDefinition: Product or product candidate consuming meaningful resources without sufficient ownership, users, evidence, usage or revenue where relevant, a justified roadmap or an explicit next lifecycle decision.
    discoveryMethods:
      - interviews
      - observation
      - prototypes
      - landing_pages
      - concierge_tests
      - fake_door_tests
      - pilots
      - usability_testing
      - willingness_to_pay_tests
      - competitor_comparisons
