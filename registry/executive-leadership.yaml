      - does_not_own_every_repository_project_customer_request_or_implementation_detail
    boundaries:
      CEO: CEO owns enterprise direction, strategic problems and portfolio-level priorities; CPO owns product strategy, discovery, validation and product portfolio decisions within that direction.
      CRO: CRO owns market and commercial evidence; CPO owns productization, product strategy and roadmap decisions.
      CTO: CPO owns what, why and for whom; CTO owns technological design, architecture, engineering, operation and supportability.
      COO: CPO owns product strategy and lifecycle decisions; COO owns enterprise operating mechanisms that enable reliable product execution and feedback.
      CFO: CPO owns product investment justification; CFO determines affordability, runway impact, economic constraints and financial sustainability.
      CLO: CPO integrates legal constraints into product decisions; CLO remains authoritative on legal interpretation and material legal-risk assessment.
